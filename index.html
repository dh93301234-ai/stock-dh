<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재고관리</title>
<meta name="theme-color" content="#03C75A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재고관리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--ac:#03C75A;--acd:#03A94D;--acs:#E8F8EF;--act:#027A38;--bg:#F5F6F8;--bd:#E3E5E8;--ln:#EAECEF;--tx:#222;--mu:#767A80;--red:#D93025;--redbg:#FFE9E9;--sel:#CDEEDB;--cur:#DDF4E6;--blue:#1A73E8;--amber:#BA7517;--hd:#F7F8FA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
/* 위쪽 */
#top{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--bd);height:50px;flex:none}
#ham{width:46px;margin:6px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:20px;cursor:pointer}
#ham:hover{background:var(--acs)}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1}
.tab{padding:0 14px;border:0;background:none;cursor:pointer;color:#696D73;font-size:15px;white-space:nowrap;position:relative;user-select:none}
.tab:hover{background:#F6F7F9}
.tab.on{color:var(--tx);font-weight:700}
.tab.on:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--ac);border-radius:2px}
.tab.drag{background:var(--acs)}
#main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column;padding:12px 16px 6px}
.page.on{display:flex}
#bar{flex:none;display:flex;gap:14px;align-items:center;background:#fff;border-top:1px solid var(--bd);padding:4px 12px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden}
#bar .sp{flex:1;overflow:hidden;text-overflow:ellipsis}
#sync{font-weight:700;color:var(--ac)}#sync.wait{color:var(--amber)}#sync.err{color:var(--red)}
#me{cursor:pointer;color:var(--tx);font-weight:700}#me:hover{color:var(--act)}
#src{cursor:pointer;font-weight:700;color:var(--act)}#src.wait{color:var(--amber)}#src.err{color:var(--red)}#src:hover{text-decoration:underline}
#ham.dragover{background:var(--acs);outline:2px dashed var(--ac)}
/* 카드·입력 */
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
.card.fill{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 10px 10px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>label{font-size:12px;color:var(--mu)}
.inp,select.inp{height:34px;border:1px solid #D5D8DC;border-radius:7px;padding:0 10px;background:#fff;outline:none;min-width:0}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(3,199,90,.15)}
.inp[readonly]{background:#F7F8F9}
.btn{height:34px;padding:0 14px;border:1px solid #D5D8DC;border-radius:7px;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F3F5F7}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--acd)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:#ECEEF1;border-radius:20px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:16px;padding:5px 18px;font-weight:700;color:var(--mu);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.seg button:hover:not(.on){color:var(--tx)}
.info{color:var(--mu);padding:10px 2px 8px;display:flex;align-items:center;gap:10px;min-height:42px}
.info .grow{flex:1}
.hint{font-size:12px;color:var(--mu);padding:5px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.notes{padding:6px 2px 0;color:var(--mu)}
.notes .err{color:var(--red)}
.red{color:var(--red)}.green{color:var(--act)}.muted{color:var(--mu)}.b{font-weight:700}
/* 표 */
.grid{flex:1;overflow:auto;outline:none;position:relative;user-select:none;min-height:60px}
.grid table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%}
.grid th{position:sticky;top:0;z-index:2;background:var(--hd);color:#5F6368;font-weight:700;text-align:left;padding:0 8px;height:34px;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.grid th .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}
.grid th.num,.grid td.num{text-align:right}
.grid th.dragover{background:var(--acs)}
.grid td{height:32px;padding:0 8px;border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid tr.cur td{background:var(--cur);color:#0B3D22}
.grid td.cs{background:var(--sel)!important}
.grid:focus td.cc{box-shadow:inset 0 0 0 2px var(--ac)}
.grid td.rc{background:var(--redbg)!important;color:var(--red)!important;font-weight:700}
.grid td.mu{color:var(--mu)}.grid td.gr{color:var(--act);font-weight:700}.grid td.rd{color:var(--red);font-weight:700}.grid td.bl{color:var(--blue);font-weight:700}.grid td.am{color:var(--amber);font-weight:700}
.grid tr.off td{color:#A0A4AA}
.grid tr.cancel td{color:#A0A4AA;text-decoration:line-through}
.grid td.ck,.grid th.ck{width:36px;text-align:center;padding:0}
.grid .more{padding:10px;color:var(--mu);text-align:center}
.grid input.cell{width:100%;height:26px;border:1px solid #D5D8DC;border-radius:5px;padding:0 6px;text-align:right;user-select:text}
.grid select.cell{width:100%;height:26px;border:1px solid #D5D8DC;border-radius:5px}
.grid input.cell.l{text-align:left}
/* 메뉴·창 */
.menu{position:fixed;z-index:1000;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:5px;min-width:200px;max-height:80vh;overflow:auto}
.mi{padding:7px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--acs)}
.mi.dis{color:#A0A4AA;cursor:default}.mi.dis:hover{background:none}
.mi.cap{font-size:12px;color:var(--mu);cursor:default}.mi.cap:hover{background:none}
.mi.b{font-weight:700}
.msep{height:1px;background:var(--ln);margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(20,24,28,.35);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--bg);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;max-width:100%;max-height:100%;min-width:320px}
.dlg .dh{padding:14px 18px 6px;font-size:17px;font-weight:700}
.dlg .db{padding:8px 18px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column}
.dlg .df{padding:10px 18px 14px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg .df .sum{flex:1;font-weight:700}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:20px;z-index:1100;opacity:.95;font-size:13.5px}
#drop{position:fixed;inset:0;z-index:950;background:rgba(3,199,90,.12);border:4px dashed var(--ac);display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--act)}
#drop.on{display:flex}
.dropbox{border:2px dashed #C9CDD2;border-radius:10px;padding:14px;text-align:center;color:var(--mu);background:#fff}
/* 지도 */
.mapwrap{flex:1;overflow:auto;outline:none;position:relative;user-select:none}
.mapg{display:grid;gap:2px;padding-right:4px}
.mh:first-child{left:0;z-index:5}
.mh{position:sticky;top:0;z-index:4;background:var(--bg);text-align:center;font-size:12px;color:var(--mu);height:22px;line-height:22px}
.mh.on{color:var(--act);font-weight:700}
.ma{position:sticky;left:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)}
.ma.on{color:var(--act);font-weight:700}
.mc{height:calc(58px * var(--mz,1));background:#F8F8F6;border:1px solid #DADCD8;border-radius:3px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:calc(13px * var(--mz,1));line-height:1.25;padding:2px;overflow:hidden;word-break:keep-all;position:relative;cursor:default}
.mc.ex{background:#EEEEEB}.mc.has{background:#fff}
.mc.chk:after{content:"";position:absolute;inset:0;background:rgba(3,199,90,.28)}
.mc.sel{outline:3px solid var(--ac);outline-offset:-1px;z-index:1}
.mc .bx{position:absolute;left:3px;top:3px;width:13px;height:13px;border:1px solid #969690;background:#fff;border-radius:2px}
.mc.chk .bx{background:var(--ac);border-color:var(--ac)}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.pal button{height:34px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-size:11.5px}
.pal button.on{border-color:var(--ac);box-shadow:0 0 0 2px #fff inset}
/* 대시보드 */
.kpis{display:flex;gap:10px;flex-wrap:wrap;flex:none}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;min-width:170px;flex:1;cursor:pointer}
.kpi .t{font-size:12px;color:var(--mu)}.kpi .v{font-size:24px;font-weight:700}
.kpi.dg{background:#FFF1F1}.kpi.dg .t,.kpi.dg .v{color:var(--red)}
.charts{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding-top:10px;min-height:0}
.charts .card{position:relative;min-height:0}
.charts canvas{position:absolute;inset:8px}
.kpi .s{font-size:12px;color:var(--mu);margin-top:2px}.kpi .s.up{color:#0F6E56}.kpi .s.dn{color:var(--red)}
.dscroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 2px 6px 0}
.ksec{font-size:12.5px;color:var(--mu);font-weight:700;margin:2px 2px -4px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.dgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:none}
.dcard{display:flex;flex-direction:column;gap:8px;min-width:0}.dcard>div:last-child{overflow-x:auto;min-width:0}
.dt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}.dt .muted{font-weight:400;font-size:12px}
.cw{position:relative;height:290px}.cw canvas{position:absolute;inset:0}
.mini{width:100%;border-collapse:collapse;font-size:13px}.mini td,.mini th{padding:5px 6px;border-bottom:1px solid #EEF0F2;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.mini th{color:var(--mu);font-weight:400;font-size:12px}.mini .n{text-align:right}.mini tr.ck{cursor:pointer}.mini tr.ck:hover td{background:#F2FBF6}
.mbar{height:10px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px}
/* 거래처 코드 */
.pwrap{flex:1;display:flex;gap:10px;min-height:0}.pwrap>.fill{flex:1;min-width:0}
.pdet{width:410px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:10px}
.pdet .ph{display:flex;align-items:center;gap:10px}
.pav{width:46px;height:46px;border-radius:50%;background:#E1F5EE;color:#085041;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}.pav.un{background:#FAEEDA;color:#854F0B}
.kp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp2>div{background:#F6F7F8;border-radius:8px;padding:8px 10px}.kp2 .t{font-size:12px;color:var(--mu)}.kp2 .v{font-size:19px;font-weight:700}
/* 로그인 */
#login{position:fixed;inset:0;background:var(--bg);z-index:980;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;word-break:keep-all}
#login .card{width:380px;max-width:100%;padding:26px;margin:auto}
#login .logo{width:56px;height:56px;border-radius:14px;background:var(--ac);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
#login .ttl{font-size:22px;font-weight:700;text-align:center}
#login .sub{color:var(--mu);text-align:center;margin:4px 0 18px;font-size:13.5px;white-space:pre-wrap}
#login .inp{width:100%;height:42px;font-size:15px}
#login .btn.big{width:100%;height:44px;font-size:15px;margin-top:14px}
#login .links{display:flex;justify-content:space-between;margin-top:14px;font-size:13.5px}
#login .links a{color:var(--act);cursor:pointer;text-decoration:none}
#login .chk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;color:var(--mu)}
#login .msg{min-height:20px;margin-top:10px;white-space:pre-wrap;font-size:13.5px}
#login .ok{background:var(--acs);color:var(--act);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;white-space:pre-wrap}
#login .step{font-size:12px;color:var(--act);font-weight:700;margin-bottom:6px}
#login .gbox{display:flex;justify-content:center;min-height:44px;margin-top:6px}
#login .back{color:var(--mu);cursor:pointer;font-size:13.5px;margin-bottom:10px;display:inline-block}
#login .rule{color:var(--mu);font-size:12px;margin-top:4px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:990;color:var(--mu);font-size:15px}
.spin{width:18px;height:18px;border:3px solid #CFE9DA;border-top-color:var(--ac);border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.kbd{display:inline-block;min-width:150px;padding:5px 10px;border:1px solid #D5D8DC;border-radius:6px;background:#fff;cursor:pointer}
.kbd.rec{border-color:var(--ac);box-shadow:0 0 0 3px rgba(3,199,90,.15)}
/* 지도 검색 */
.mc.hit{box-shadow:0 0 0 2px #fff,0 0 0 5px #0F6E56;z-index:1}
.mc.hit.cur2{outline:3px dashed #EF9F27;outline-offset:6px;z-index:2}
.mc.dim{opacity:.22}
.mapg.qon{gap:8px;padding:6px 6px 8px 0}
.mapg.qon .mh,.mapg.qon .ma{box-shadow:0 0 0 4px var(--bg)}
.mapg.qon .mh:first-child{box-shadow:0 0 0 8px var(--bg)}
.mc.hit[data-fl]:before{content:attr(data-fl);font-size:11.5px;font-weight:700}
.mapq{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* 상품 추가 */
.pform{display:grid;grid-template-columns:110px minmax(0,1fr) 110px minmax(0,1fr);gap:8px 10px;align-items:center}
.pform>label{font-size:13px;color:var(--mu);text-align:right}
.pform .full{grid-column:2 / 5}
.psec{grid-column:1 / 5;font-weight:700;margin-top:6px;padding-top:8px;border-top:1px solid var(--ln)}
/* 폰 / PC 화면 */
.card.fill,.grid,.mapwrap{min-width:0}
.grid,.mapwrap{-webkit-overflow-scrolling:touch}
#viewBtn{display:none;cursor:pointer;color:var(--act);font-weight:700;border:1px solid var(--bd);border-radius:12px;padding:0 10px}
#zoomBox{position:fixed;right:10px;bottom:10px;z-index:970;display:none;gap:4px;background:#fff;border:1px solid var(--bd);border-radius:22px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#zoomBox button{min-width:40px;height:36px;border:0;border-radius:18px;background:#F1F3F4;font-weight:700;font-size:15px}
#zoomBox span{align-self:center;font-size:12px;color:var(--mu);min-width:38px;text-align:center}
html.pc{overflow:hidden;height:100%}html.pc body{overflow:auto;height:100%;touch-action:pan-x pan-y}
html.pc #stage{position:relative}
html.pc #app{position:absolute;left:0;top:0;width:1280px;transform-origin:0 0}
html.pc #zoomBox{display:flex}
html.pc #viewBtn,html.narrow #viewBtn{display:inline-block}
#stage{height:100%}
/* 폰: 두 번 누르기 확대 막기, 열 경계 손잡이 크게 */
html,body,.grid,.mapwrap,button{touch-action:manipulation}
@media (pointer:coarse){.grid th .rz{width:22px}.grid th .rz:after{content:"";position:absolute;right:6px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--ac);opacity:.55}.grid th{padding-right:22px}}
@media (max-width:760px){.page{padding:8px}.page>.hint{display:none}
.scard{padding:8px 10px}.scard .row{gap:6px}.scard .fld{flex:1 1 calc(50% - 6px)!important;width:auto!important;min-width:0!important}.scard .inp{width:100%!important}.scard .btn{height:32px;padding:0 12px}
.info{min-height:0;padding:6px 2px;flex-wrap:wrap;gap:6px}.info .pn{flex-basis:100%;color:var(--tx);font-weight:700}.pform{grid-template-columns:90px minmax(0,1fr)}.pform .full,.psec{grid-column:1 / 3}.pform .full{grid-column:2 / 3}.charts{grid-template-columns:1fr;grid-template-rows:repeat(4,260px);overflow:auto}.hide-m{display:none}
.scard .fld.dfp{flex-basis:100%!important}.dfp .seg{flex-wrap:wrap;border-radius:14px}.dfp .seg button{padding:0 10px}
.dgrid,.dgrid3{grid-template-columns:minmax(0,1fr)}.cw{height:250px}.kpi{min-width:140px;padding:6px 10px}.kpi .v{font-size:20px}
.pwrap{flex-direction:column}.pwrap>.fill{flex:1 1 50%;min-height:200px}.pdet{width:auto;flex:1 1 50%}}
@media print{body *{visibility:hidden}}
</style>
</head>
<body>
<div id="loading"><span class="spin"></span>불러오는 중…</div>
<div id="stage"><div id="app" style="display:none">
  <div id="top"><button id="ham" title="메뉴">☰</button><div id="tabs"></div></div>
  <div id="main"></div>
  <div id="bar"><span id="sync">● 저장됨</span><span id="src" title="원본 시트 연결 · 클릭 = 지금 다시 읽기"></span><span class="sp" id="stat"></span><span id="online"></span><span id="viewBtn"></span><span id="me"></span></div>
</div></div>
<div id="zoomBox"><button id="zOut" aria-label="축소">－</button><span id="zTxt"></span><button id="zIn" aria-label="확대">＋</button><button id="zFit">맞춤</button><button id="zPhone">폰 화면</button></div>
<div id="drop">엑셀 파일을 놓으세요</div>
<script>
'use strict';
/* ============ 기본 도구 ============ */
const CODEK=['품목코드','상품코드','제품코드','상품번호','품번','SKU','코드'], NAMEK=['품목명','상품명','제품명','품명','상품','품목'];
const QTYK=['수량(EA)','수량','EA','출고수량','입고수량','QTY','개수'];
const ROLES=['읽음 전용','입출고 가능','관리자'], UNKNOWN='미확인';

// 앱 화면 → Apps Script 서버(doPost).  config.js 의 API_URL = 웹 앱 주소(…/exec)
const CFG=window.APP_CONFIG||{};
async function call(fn,...args){
  if(!CFG.API_URL||/여기에/.test(CFG.API_URL))throw new Error('config.js 에 서버 주소(API_URL)가 없습니다. 설치 방법을 확인하세요.');
  let res;
  try{res=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'});}
  catch(e){throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.');}
  let o;try{o=await res.json();}catch(e){throw new Error('서버 응답을 읽지 못했습니다. (서버 배포 설정을 확인하세요: 액세스 권한 = 모든 사용자)');}
  if(!o.ok)throw new Error(o.e||'서버 오류');
  return o.r;
}

/* ============ 엑셀 읽기 (거래명세서 · 전산 재고 파일) ============ */
function readAoa(buf){const wb=XLSX.read(buf,{type:'array',cellDates:false});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(r=>r.map(v=>v==null?'':v));}
function parseSlip(aoa){let hr=-1,cc=-1,cn=-1,cq=-1;
  for(let r=0;r<Math.min(60,aoa.length)&&hr<0;r++){const row=aoa[r].map(str);const u=new Set();const code=findCol(row,CODEK,u);if(code<0)continue;
    let q=-1;for(let i=0;i<row.length&&q<0;i++)if(!u.has(i)&&QTYK.some(k=>norm(k)===norm(row[i])))q=i;
    for(let i=0;i<row.length&&q<0;i++){const x=norm(row[i]);if(!u.has(i)&&x&&!x.includes('BOX')&&(x.includes('수량')||x.includes('QTY')))q=i;}
    if(q<0)continue;u.add(q);hr=r;cc=code;cq=q;cn=findCol(row,NAMEK,u);}
  if(hr<0)return null;const res={slip:'',partner:'',wh:'',lines:[]};
  const assign=(k,v)=>{if(!v)return;if(!res.slip&&/전표|주문번호|문서번호|송장번호/.test(k))res.slip=v;else if(!res.partner&&/거래처|공급처|납품처|매입처|매출처|업체|수신|고객/.test(k))res.partner=v;else if(!res.wh&&k.includes('창고'))res.wh=v;};
  for(let r=0;r<hr;r++){const row=aoa[r];for(let c=0;c<row.length;c++){const cell=str(row[c]);if(!cell)continue;const nx=()=>{for(let k=c+1;k<Math.min(c+4,row.length);k++){const v=str(row[k]);if(v)return v.replace(/^[:：]\s*/,'');}return '';};
    const p=cell.search(/[:：]/);if(p>=0){let v=cell.slice(p+1).trim();if(!v)v=nx();assign(norm(cell.slice(0,p)),v);}else assign(norm(cell),nx());}}
  for(let r=hr+1;r<aoa.length;r++){const row=aoa[r];if(row.some(x=>{const n=norm(x);return n.startsWith('합계')||n==='총계'||n==='소계'||n==='TOTAL'||n.startsWith('총합계');}))break;
    const code=str(row[cc]);if(!code)continue;const q=num(row[cq]);if(!q)continue;res.lines.push({row:r+1,code,name:cn>=0?str(row[cn]):'',qty:q});}
  return res.lines.length?res:null;}
function parseStockFile(aoa){const heads=['합계','현재고','재고합계','재고수량','재고량','총재고','재고','전산재고'];let hr=-1,cc=-1,cn=-1,cq=-1;
  for(let r=0;r<Math.min(30,aoa.length)&&hr<0;r++){const row=aoa[r].map(str);const u=new Set();const code=findCol(row,CODEK,u);if(code<0)continue;let q=-1;
    for(const k of heads){for(let i=0;i<row.length&&q<0;i++)if(!u.has(i)&&norm(row[i])===norm(k))q=i;if(q>=0)break;}if(q<0)continue;u.add(q);hr=r;cc=code;cq=q;cn=findCol(row,NAMEK,u);}
  if(hr<0)return null;const s={wh:'',time:'',lines:[]};const dt=/(\d{4})[/.-](\d{1,2})[/.-](\d{1,2})(?:\s+(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?)?/i;
  const take=t=>{const m=dt.exec(str(t));if(!m)return;let v=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);if(m[5]){let hh=+m[5];const ap=(m[4]||'').toUpperCase();if((ap==='오후'||ap==='PM')&&hh<12)hh+=12;if((ap==='오전'||ap==='AM')&&hh===12)hh=0;v+=' '+pad(hh)+':'+m[6]+':'+(m[7]||'00');}if(!s.time||(v.length>s.time.length&&v.slice(0,10)===s.time.slice(0,10)))s.time=v;};
  for(let r=0;r<hr;r++)for(const cell of aoa[r]){const t=str(cell);if(!t)continue;take(t);for(let p of t.split(/[/|,]/)){p=p.trim();const ci=p.search(/[:：]/);if(ci>=0)p=p.slice(ci+1).trim();if(!s.wh&&p.includes('창고')&&p.length<=20)s.wh=p;}}
  if(!s.wh&&aoa[hr][cq+1]&&str(aoa[hr][cq+1]).includes('창고'))s.wh=str(aoa[hr][cq+1]);
  const byc=new Map();for(let r=hr+1;r<aoa.length;r++){const code=str(aoa[r][cc]);const n=norm(code);if(!code)continue;if(n.startsWith('합계')||n==='총계'||n==='소계'||n==='TOTAL'||n.startsWith('총합계'))continue;
    if(typeof aoa[r][cc]==='string'&&dt.test(code)){take(code);continue;}const qs=str(aoa[r][cq]);if(!qs)continue;const q=num(aoa[r][cq]);
    if(byc.has(code.toUpperCase())){byc.get(code.toUpperCase()).qty+=q;continue;}const l={code,name:cn>=0?str(aoa[r][cn]):'',qty:q};byc.set(code.toUpperCase(),l);s.lines.push(l);}
  return s.lines.length?s:null;}

/* 파일을 받으면: 종류를 알아보고 고르게 하기 */
async function handleFile(file,force){if(!/\.(xlsx|xls|xlsm|csv)$/i.test(file.name)){alert2('엑셀 파일(.xlsx)만 가져올 수 있습니다.');return;}
  let buf,aoa;try{buf=await file.arrayBuffer();aoa=readAoa(buf);}catch(e){alert2('파일을 읽지 못했습니다.\n'+e.message);return;}
  const f={name:file.name,buf};if(force==='상품'){if(!need(1))return;prodImport(aoa,f);return;}if(force==='거래처'){if(!need(1))return;partImport(aoa,f);return;}
  const slip=parseSlip(aoa),stock=parseStockFile(aoa);
  if(force==='입고'||force==='출고'){if(!slip){alert2('\'품목코드\'(또는 상품코드)와 \'수량\' 머릿말이 있는 줄을 찾지 못했습니다.');return;}if(!need(1))return;importDlg(force,slip,f);return;}
  if(force==='재고'){if(!stock){alert2('\'품목코드\'와 \'합계\'(또는 현재고) 머릿말이 있는 재고 파일이 아닙니다.');return;}if(!need(1))return;stockDlg(stock,f);return;}
  if(!slip&&!stock){alert2('가져올 수 있는 형식이 아닙니다.\n· 거래명세서: 품목코드 + 수량 열\n· 전산 재고 파일: 품목코드 + 합계 열');return;}
  if(!need(1))return;
  const btns=[{t:'취소'}];
  if(stock)btns.push({t:'재고 업데이트',pri:!slip,fn:()=>{setTimeout(()=>stockDlg(stock,f),0);}});
  if(slip){btns.push({t:'출고로 가져오기',fn:()=>{setTimeout(()=>importDlg('출고',slip,f),0);}});btns.push({t:'입고로 가져오기',pri:1,fn:()=>{setTimeout(()=>importDlg('입고',slip,f),0);}});}
  const dup=slip&&slip.slip?M.recs.find(x=>x.slip===slip.slip&&x.method==='엑셀'&&x.state!=='취소됨'):null;
  modal('파일 가져오기',h('div',null,h('div',{class:'b'},file.name),
    slip?h('div',{style:{marginTop:'6px'}},'거래명세서 · 품목 '+slip.lines.length+'줄 · 수량 '+fmt(slip.lines.reduce((s,l)=>s+l.qty,0))+(slip.slip?' · 전표 '+slip.slip:'')):null,
    stock?h('div',{style:{marginTop:'6px'}},'전산 재고 파일 · '+stock.lines.length+'품목 · 합계 '+fmt(stock.lines.reduce((s,l)=>s+l.qty,0))+(stock.time?' · 기준 '+stock.time:'')):null,
    dup?h('div',{class:'red',style:{marginTop:'6px'}},'※ 이 전표는 이미 '+dup.type+'로 가져왔습니다 ('+dup.time.slice(5,16)+')'):null,
    h('div',{class:'muted',style:{marginTop:'10px'}},'어떻게 가져올까요? 누르면 미리보기가 먼저 열립니다.')),btns);}

    google.accounts.id.initialize({client_id:g.cid,callback:r=>onToken(r.credential),auto_select:false,cancel_on_tap_outside:true,ux_mode:'popup',itp_support:true,use_fedcm_for_prompt:true});
    google.accounts.id.renderButton(box,{theme:'outline',size:'large',text:'continue_with',shape:'rectangular',locale:'ko',width:Math.min(320,(box.clientWidth||320))});}
  catch(e){box.innerHTML='';box.append(h('div',{class:'red',style:{whiteSpace:'pre-wrap'}},e.message));}}

function showLogin(msg,o){o=o||{};$('#loading').style.display='none';let el=$('#login');if(el)el.remove();
  const card=h('div',{class:'card'});el=h('div',{id:'login'},card);document.body.append(el);
  const head=(sub)=>[h('div',{class:'logo',html:LOGO_SVG}),h('div',{class:'ttl'},'재고관리'),h('div',{class:'sub'},sub)];
  const msgEl=(t,cls)=>h('div',{class:'msg '+(cls||'red')},t||'');
  const back=()=>h('span',{class:'back',onclick:()=>showLogin('',{id:o.id})},'← 로그인으로');
  const keepBox=()=>{const c=h('input',{type:'checkbox'});c.checked=LS.get('keepPref',true);c.onchange=()=>LS.set('keepPref',c.checked);return {el:h('label',{class:'chk'},c,'로그인 유지 (이 기기에서 30일)'),get v(){return c.checked;}};};
  const busy=(b,on,txt)=>{b.disabled=on;if(txt)b.textContent=on?'처리 중…':txt;};
  const enter=(els,fn)=>els.forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')fn();}));
  const pwFields=()=>{const p1=inp({type:'password',autocomplete:'new-password',placeholder:'영문+숫자 8자 이상'}),p2=inp({type:'password',autocomplete:'new-password',placeholder:'한 번 더 입력'});
    return {els:[p1,p2],ui:[fld('비밀번호',p1),h('div',{style:{height:'10px'}}),fld('비밀번호 확인',p2),h('div',{class:'rule'},'영문과 숫자를 섞어 8자 이상')],
      check(){const a=p1.value,b=p2.value;if(a.length<8||!/[A-Za-z]/.test(a)||!/\d/.test(a))return '비밀번호는 8자 이상, 영문과 숫자를 섞어서 만들어 주세요.';if(a!==b)return '비밀번호 확인이 맞지 않습니다.';return '';},get v(){return p1.value;}};};
  const enterApp=(r,keep)=>{TOK.set(r.token,keep);LS.set('lastId',r.id);el.remove();start();};

  // ---- 로그인 ----
  if(!o.mode||o.mode==='login'){
    const id=inp({value:o.id||LS.get('lastId',''),placeholder:'아이디',autocomplete:'username',autocapitalize:'off'}),pw=inp({type:'password',placeholder:'비밀번호',autocomplete:'current-password'});
    const kp=keepBox(),m=msgEl(msg,o.okMsg?'green':'red');if(o.okMsg)m.textContent=o.okMsg;
    const go=async()=>{if(!str(id.value)||!pw.value){m.className='msg red';m.textContent='아이디와 비밀번호를 입력하세요.';return;}m.textContent='';busy(btn,true,'로그인');
      try{const r=await call('api_login',{id:str(id.value),pw:pw.value,keep:kp.v});enterApp(r,kp.v);}catch(e){m.className='msg red';m.textContent=e.message;busy(btn,false,'로그인');pw.select();}};
    const btn=h('button',{class:'btn pri big',onclick:go},'로그인');
    card.append(...head('원본 구글 시트를 공유받은 사람만 쓸 수 있어요'),fld('아이디',id),h('div',{style:{height:'10px'}}),fld('비밀번호',pw),kp.el,btn,m,
      h('div',{class:'links'},h('a',{onclick:()=>showLogin('',{mode:'signup'})},'처음이에요 · 회원가입'),h('a',{onclick:()=>showLogin('',{mode:'find'})},'아이디·비밀번호 찾기')));
    enter([id,pw],go);setTimeout(()=>(str(id.value)?pw:id).focus(),30);return;}

  // ---- 회원가입 ----
  if(o.mode==='signup'){
    const body=h('div'),m=msgEl(msg);
    card.append(back(),...head('원본 구글 시트를 공유받은 Google 계정인지 확인한 뒤\n아이디·비밀번호를 만들어요'),body,m);
    const step1=()=>{body.innerHTML='';const gb=h('div',{class:'gbox'});body.append(h('div',{class:'step'},'1단계 · Google로 본인 확인'),gb,h('div',{class:'rule',style:{textAlign:'center',marginTop:'8px'}},'Google 계정은 본인 확인에만 쓰고, 다음부터는 아이디·비밀번호로 접속해요'));
      gButton(gb,async tok=>{m.className='msg muted';m.textContent='확인 중…';
        try{const r=await call('api_gCheck',tok);m.textContent='';if(r.hasAccount)already(r);else step2(r);}catch(e){m.className='msg red';m.textContent=e.message;}});};
    const already=r=>{body.innerHTML='';body.append(h('div',{class:'ok'},'이 Google 계정('+r.email+')으로 이미 가입했어요.\n아이디: '+r.id),
      h('button',{class:'btn pri big',onclick:()=>showLogin('',{id:r.id})},'이 아이디로 로그인'),h('button',{class:'btn big',style:{marginTop:'8px'},onclick:()=>showLogin('',{mode:'find'})},'비밀번호를 잊었어요'));};
    const step2=r=>{body.innerHTML='';const nm=inp({value:r.gname||'',placeholder:'예: 홍길동'}),id=inp({placeholder:'영문·숫자 4~20자',autocomplete:'username',autocapitalize:'off'}),pf=pwFields(),kp=keepBox();
      const go=async()=>{const nmv=str(nm.value),idv=str(id.value);let err='';if(!nmv)err='이름을 입력하세요.';else if(!/^[A-Za-z0-9_.-]{4,20}$/.test(idv))err='아이디는 영문·숫자 4~20자로 만들어 주세요.';else err=pf.check();
        if(err){m.className='msg red';m.textContent=err;return;}m.textContent='';busy(btn,true,'가입하고 시작하기');
        try{const x=await call('api_signup',r.ticket,{id:idv,pw:pf.v,name:nmv,keep:kp.v});enterApp(x,kp.v);setTimeout(()=>toast(x.master?'마스터로 가입했습니다':'가입했습니다. 권한: '+x.role),800);}
        catch(e){m.className='msg red';m.textContent=e.message;busy(btn,false,'가입하고 시작하기');if(/본인 확인 후/.test(e.message))step1();}};
      const btn=h('button',{class:'btn pri big',onclick:go},'가입하고 시작하기');
      body.append(h('div',{class:'ok'},'✓ '+r.email+'\n'+(r.master?'★ 앱 서버를 설치한 계정이라 마스터로 가입됩니다.':'원본 시트를 공유받은 계정이에요.')),
        h('div',{class:'step'},'2단계 · 아이디·비밀번호 만들기'),fld('이름 (작업 기록에 남는 이름)',nm),h('div',{style:{height:'10px'}}),fld('아이디',id),h('div',{style:{height:'10px'}}),...pf.ui,kp.el,btn);
      enter([nm,id,...pf.els],go);setTimeout(()=>id.focus(),30);};
    step1();return;}

  // ---- 아이디·비밀번호 찾기 ----
  if(o.mode==='find'){
    const body=h('div'),m=msgEl(msg);
    card.append(back(),...head('가입할 때 쓴 Google 계정으로 확인하면\n아이디를 알려 드리고 새 비밀번호를 정할 수 있어요'),body,m);
    const gb=h('div',{class:'gbox'});body.append(h('div',{class:'step'},'Google로 본인 확인'),gb);
    gButton(gb,async tok=>{m.className='msg muted';m.textContent='확인 중…';
      try{const r=await call('api_gCheck',tok);m.textContent='';body.innerHTML='';
        if(!r.hasAccount){body.append(h('div',{class:'ok',style:{background:'#FFF4E0',color:'#854F0B'}},r.email+'\n이 Google 계정으로 가입한 아이디가 없어요.'),h('button',{class:'btn pri big',onclick:()=>showLogin('',{mode:'signup'})},'회원가입 하기'));return;}
        const pf=pwFields();
        const go=async()=>{const err=pf.check();if(err){m.className='msg red';m.textContent=err;return;}m.textContent='';busy(btn,true,'새 비밀번호로 바꾸기');
          try{const x=await call('api_resetPw',r.ticket,pf.v);showLogin('',{id:x.id,okMsg:'비밀번호를 바꿨어요. 새 비밀번호로 로그인하세요.\n(다른 기기에 로그인돼 있던 것은 모두 로그아웃됐어요)'});}
          catch(e){m.className='msg red';m.textContent=e.message;busy(btn,false,'새 비밀번호로 바꾸기');}};
        const btn=h('button',{class:'btn pri big',onclick:go},'새 비밀번호로 바꾸기');
        body.append(h('div',{class:'ok'},'✓ '+r.email+'\n내 아이디: '+r.id),h('div',{class:'step'},'새 비밀번호 정하기 (비밀번호가 기억나면 건너뛰세요)'),...pf.ui,btn,
          h('button',{class:'btn big',style:{marginTop:'8px'},onclick:()=>showLogin('',{id:r.id})},'비밀번호 기억나요 · 로그인하기'));enter(pf.els,go);}
      catch(e){m.className='msg red';m.textContent=e.message;}});
    return;}
}
function myPwDlg(){const a=inp({type:'password',autocomplete:'current-password'}),b=inp({type:'password',autocomplete:'new-password',placeholder:'영문+숫자 8자 이상'}),c=inp({type:'password',autocomplete:'new-password'});
  const er=h('div',{class:'red',style:{minHeight:'18px',marginTop:'8px',whiteSpace:'pre-wrap'}});
  const body=h('div',{style:{width:'340px',maxWidth:'86vw',display:'flex',flexDirection:'column',gap:'10px'}},fld('지금 비밀번호',a),fld('새 비밀번호',b),fld('새 비밀번호 확인',c),h('div',{class:'muted',style:{fontSize:'12px'}},'바꾸면 다른 기기에 로그인된 것은 모두 로그아웃됩니다.'),er);
  modal('내 비밀번호 바꾸기',body,[{t:'취소'},{t:'바꾸기',pri:1,fn:async()=>{const n=b.value;if(n.length<8||!/[A-Za-z]/.test(n)||!/\d/.test(n)){er.textContent='새 비밀번호는 8자 이상, 영문과 숫자를 섞어 주세요.';return false;}if(n!==c.value){er.textContent='새 비밀번호 확인이 맞지 않습니다.';return false;}
    try{const keep=TOK.keep();const r=await call('api_changePw',auth(),a.value,n,keep);TOK.set(r.token,keep);toast('비밀번호를 바꿨습니다');}catch(e){er.textContent=e.message;return false;}}}]);setTimeout(()=>a.focus(),30);}

/* ============ 단축키 · 끌어다 놓기 ============ */
document.addEventListener('keydown',e=>{if(!S.me||$('#login'))return;if(document.querySelector('.ov')&&e.key!=='F5')return;const n=keyName(e);if(!n)return;const s=sc();
  if(n===s.refresh){e.preventDefault();load();return;}const vt=visTabs();let i=vt.indexOf(cur);
  if(n===s.next){e.preventDefault();showPage(vt[(i+1)%vt.length]);return;}if(n===s.prev){e.preventDefault();showPage(vt[(i-1+vt.length)%vt.length]);return;}
  const m=n.match(/^(.*)\+([1-9])$/);if(m&&m[1]===s.tabMod){const k=vt[+m[2]-1];if(k){e.preventDefault();showPage(k);}}});
let dragN=0;
document.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragN++;$('#drop').classList.add('on');}});
document.addEventListener('dragleave',e=>{if([...e.dataTransfer.types].includes('Files')){dragN=Math.max(0,dragN-1);if(!dragN)$('#drop').classList.remove('on');}});
document.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault();});
document.addEventListener('drop',e=>{if(!e.dataTransfer.files||!e.dataTransfer.files.length)return;e.preventDefault();dragN=0;$('#drop').classList.remove('on');if(!S.me)return;if(document.querySelector('.ov')){toast('열려 있는 창을 먼저 닫아 주세요');return;}handleFile(e.dataTransfer.files[0]);});

/* ============ 폰 / PC 화면 ============ */
const VIEW={z:1,H:800,W:1280};
const isPc=()=>LS.get('view','auto')==='pc';
const fitZ=()=>Math.min(1,innerWidth/VIEW.W);
function setZoom(z,cx,cy){const se=document.body;const z0=VIEW.z;z=Math.max(0.2,Math.min(2.5,z));
  if(cx==null){cx=innerWidth/2;cy=innerHeight/2;}const px=(se.scrollLeft+cx)/z0,py=(se.scrollTop+cy)/z0;VIEW.z=z;VIEW.H=Math.round(Math.max(680,Math.min(2400,innerHeight/z)));
  const app=$('#app'),st=$('#stage');app.style.height=VIEW.H+'px';app.style.transform='scale('+z+')';st.style.width=Math.ceil(VIEW.W*z)+'px';st.style.height=Math.ceil(VIEW.H*z)+'px';
  se.scrollLeft=px*z-cx;se.scrollTop=py*z-cy;$('#zTxt').textContent=Math.round(z*100)+'%';LS.set('zoom',z);}
function applyView(){const pc=isPc(),de=document.documentElement;de.classList.toggle('pc',pc);de.classList.toggle('narrow',!pc&&innerWidth<900);
  const app=$('#app'),st=$('#stage');
  if(pc){const f=fitZ();VIEW.H=Math.round(Math.max(680,Math.min(1000,innerHeight/f)));VIEW.z=LS.get('zoom',0)||f;setZoom(VIEW.z,0,0);}
  else{app.style.transform='';app.style.height='';st.style.width='';st.style.height='';}
  $('#viewBtn').textContent=pc?'📱 폰 화면':'🖥 PC 화면';}
function setView(pc){LS.set('view',pc?'pc':'auto');LS.set('zoom',0);applyView();document.body.scrollTo(0,0);toast(pc?'PC 화면: 두 손가락으로 확대·축소, 한 손가락으로 밀어서 이동':'폰 화면으로 돌아왔습니다');}
(function(){let pin=null;
  document.addEventListener('touchstart',e=>{if(!isPc()||e.touches.length!==2)return;const a=e.touches[0],b=e.touches[1];pin={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:VIEW.z};},{passive:true});
  document.addEventListener('touchmove',e=>{if(!pin||e.touches.length!==2)return;e.preventDefault();const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);setZoom(pin.z*d/pin.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)pin=null;});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(isPc()){const z=VIEW.z;const f=fitZ();VIEW.H=Math.round(Math.max(680,Math.min(1000,innerHeight/f)));setZoom(z);}else applyView();},200);});
  $('#zIn').onclick=()=>setZoom(VIEW.z*1.25);$('#zOut').onclick=()=>setZoom(VIEW.z/1.25);$('#zFit').onclick=()=>{setZoom(fitZ(),0,0);document.body.scrollTo(0,0);};$('#zPhone').onclick=()=>setView(false);
  $('#viewBtn').onclick=()=>setView(!isPc());})();

/* ============ 시작 ============ */
async function start(){$('#loading').style.display='flex';await load();if(!S.me)return;$('#loading').style.display='none';$('#app').style.display='flex';applyView();
  if(!Object.keys(P).some(k=>P[k].el)){for(const [k] of PAGES){P[k]=P[k]();$('#main').append(P[k].el);P[k].stale=true;}P.search.init();}
  $('#ham').onclick=hamMenu;{const hb=$('#ham');hb.ondragover=e=>{if([...e.dataTransfer.types].includes('text/tab')){e.preventDefault();hb.classList.add('dragover');}};hb.ondragleave=()=>hb.classList.remove('dragover');hb.ondrop=e=>{hb.classList.remove('dragover');const f=e.dataTransfer.getData('text/tab');if(!f)return;e.preventDefault();setHidden(f,true);toast('\''+pageTitle(f)+'\' 탭을 ☰ 메뉴로 뺐습니다');};}$('#src').onclick=()=>{if(!S.set['src.loc']&&!S.set['src.ret'])srcDlg();else syncNow();};$('#me').onclick=e=>{const r=e.target.getBoundingClientRect();menu(r.left,r.top-110,[{t:S.me.name+' · '+(S.me.master?'마스터':S.me.role),cap:1},{t:'내 비밀번호 바꾸기',fn:myPwDlg},{t:'로그아웃',fn:logout}]);};
  const last=LS.get('page','search');showPage(visTabs().includes(last)?last:visTabs()[0]);startPoll();if(can(2)&&!S.set['src.loc']&&!S.set['src.ret'])setTimeout(srcDlg,300);}
window.addEventListener('load',()=>{if(!TOK.get()){showLogin();return;}start();});
